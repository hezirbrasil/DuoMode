name: Testes automatizados do ACUAS Fitness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Testes de regressão no navegador
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm install
      - name: Instalar navegador de teste
        run: npx playwright install --with-deps chromium
      - name: Executar testes
        run: npm test
      - name: Salvar relatório quando houver falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
